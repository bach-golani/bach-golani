<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בא״ח גולני – הכל במקום אחד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-first app shell, 520px column. Golani split header (sand/olive diagonal), serif display over sans body, heritage palette. */
  --bg:#f3ead8;
  --paper:#fbf7ec;
  --stone:#e9dcbd;
  --ink:#23301f;
  --ink-2:#5b5442;
  --ink-3:#857b63;
  --green:#3f5a2e;
  --green-2:#4d6b39;
  --leaf:#d9c79c;
  --gold:#c9a961;
  --sand:#e6d6ae;
  --line:#d8ccb0;
  --sage:#e6d6ae; --lav:#e6d6ae; --blush:#e3d3b4; --cream:#efe3c8; --sky:#e6d6ae; --beige:#e9dcbd; --mint:#e6d6ae;
  --warn:#a4462a;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --ui:"Heebo","Arial Hebrew",Arial,sans-serif;
  --body:"Assistant","Heebo","Arial Hebrew",Arial,sans-serif;
  --shadow:0 1px 2px rgba(35,48,31,.05),0 8px 24px rgba(60,48,20,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green-2);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.emb{width:46px;height:46px;border-radius:15px;background:var(--green);display:grid;place-items:center;box-shadow:var(--shadow)}
.emb svg{width:30px;height:30px}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:20px;line-height:1.1;color:var(--green)}
.brand span{font-size:13px;color:var(--ink-2)}
.date-chip{background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--green);box-shadow:var(--shadow)}

.ph-hero{position:relative;height:270px;border-radius:30px;overflow:hidden;margin:16px 0 14px;box-shadow:0 14px 30px rgba(22,38,27,.18);background:#2b3a2f}
.ph-hero .sl{position:absolute;inset:0;background-size:cover;opacity:0;transition:opacity 1.2s ease;transform:scale(1.04)}
.ph-hero .sl.on{opacity:1;animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.ph-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,24,16,.82) 0%,rgba(12,24,16,.25) 50%,rgba(12,24,16,0) 75%)}
.ph-hero .ov{position:absolute;right:20px;left:20px;bottom:18px;z-index:1;color:#fff}
.ph-hero .ov .hello{color:#fff;margin:0}
.ph-hero .ov .sub{color:rgba(255,255,255,.85);margin:4px 0 0}
.dots{position:absolute;top:14px;left:16px;z-index:1;display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.5);transition:width .3s}
.dots i.on{width:18px;background:#fff}
.hello{margin:24px 0 2px;font-size:38px;font-weight:900;letter-spacing:-.6px;line-height:1.05}
.sub{color:var(--ink-2);margin:6px 0 18px;font-size:17px}

.search{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:0 16px;height:54px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{width:21px;height:21px;flex:none;color:var(--ink-3)}

/* ---------- countdown hero ---------- */
.cd{margin-top:18px;border:0;width:100%;text-align:right;color:#f3f0e6;border-radius:26px;padding:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 0% 0%,#4a7158 0%,var(--green) 55%,#1a3022 100%);box-shadow:0 14px 30px rgba(38,66,50,.28)}
.cd::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);left:-60px;bottom:-110px;box-shadow:0 0 0 30px rgba(255,255,255,.03),0 0 0 60px rgba(255,255,255,.02)}
.cd-top{display:flex;justify-content:space-between;align-items:center}
.cd-eyebrow{font-size:13px;font-weight:700;letter-spacing:.3px;opacity:.75}
.cd-title{font-family:var(--display);font-size:20px;font-weight:800;margin-top:2px}
.cd-edit{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.cd-row{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.cd-u{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 4px;text-align:center}
.cd-u b{display:block;font-family:var(--display);font-size:30px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.cd-u small{font-size:12px;opacity:.72}
.cd-u.main{flex:1.35;background:rgba(255,255,255,.92);color:var(--green)}
.cd-u.main small{opacity:.8}
.cd-foot{margin-top:12px;font-size:13px;opacity:.75;position:relative;z-index:1}

/* ---------- feature (gantt) ---------- */
.feature{margin-top:14px;display:grid;grid-template-columns:1.1fr 1fr;align-items:stretch;background:var(--sage);border-radius:26px;overflow:hidden;border:0;padding:0;width:100%;text-align:right;box-shadow:var(--shadow);min-height:168px}
.feature .t{padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.feature h3{font-size:24px;font-weight:900;line-height:1.1}
.feature p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.feature .im{background-size:cover;background-position:center}
.arrow{width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.06);flex:none}
.arrow svg{width:15px;height:15px}

/* ---------- tools grid ---------- */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sec-head h2{font-size:24px;font-weight:900}
.sec-head span{font-size:14px;color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--paper);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--green);color:#fff}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;padding:0;text-align:right;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.tile:active,.feature:active,.cd:active{transform:scale(.98)}
.tile.wide{grid-column:1/-1}
.tile.wide .ph{height:150px}
.tile .ph{height:112px;background-size:cover;background-position:center}
.tile .t{padding:12px 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1}
.tile h3{font-size:17px;font-weight:800;line-height:1.15}
.tile small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.tile .arrow{width:32px;height:32px;background:var(--bg);box-shadow:none}
@media (max-width:360px){.grid{grid-template-columns:1fr}.hello{font-size:32px}}

.status{font-size:13px;color:var(--ink-3);text-align:center;margin-top:22px;min-height:1em}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 24px));
  background:rgba(251,247,236,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 10px 30px rgba(22,38,27,.15);
  display:flex;justify-content:space-around;padding:8px 6px;z-index:40}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-3);padding:4px 8px;border-radius:14px;min-width:56px}
.nav svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--green);background:var(--sage)}

/* ---------- inner screens ---------- */
.cover{position:relative;height:190px;border-radius:28px;overflow:hidden;background-size:cover;background-position:center;margin-bottom:16px;box-shadow:var(--shadow)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(16,30,20,.72),rgba(16,30,20,.05) 60%)}
.cover .back{position:absolute;top:12px;right:12px;z-index:2}
.cover .act{position:absolute;top:12px;left:12px;z-index:2}
.cover .ct{position:absolute;bottom:16px;right:18px;left:18px;color:#fff;z-index:1}
.cover h1{font-size:30px;font-weight:900;line-height:1.05}
.cover p{margin:4px 0 0;font-size:14px;opacity:.85}
.back{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.back svg{width:17px;height:17px}
.add{border:0;background:var(--green);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.act.add{background:rgba(255,255,255,.92);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.plain-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.plain-bar h1{font-size:28px;font-weight:900}
.plain-bar .back{background:var(--paper)}

.seg{display:flex;gap:4px;background:var(--stone);border-radius:16px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:9px 10px;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.list{display:flex;flex-direction:column;gap:10px}
.row-item{background:var(--paper);border:0;border-radius:20px;padding:14px;text-align:right;width:100%;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:900;color:var(--green);font-size:15px}
.row-item .m{flex:1;min-width:0}
.row-item h3{font-size:17px;font-weight:800;line-height:1.25}
.row-item .d{font-size:13px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:var(--sage);color:var(--green);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.row-item p{margin:5px 0 0;color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{background:var(--paper);border:1.5px dashed #d8d3c6;border-radius:22px;padding:26px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.empty .add{margin-top:12px}

/* ---------- gantt ---------- */
.note{display:flex;gap:10px;align-items:center;background:var(--cream);border-radius:16px;padding:10px 14px;font-size:14px;color:#6b5527;margin-bottom:12px}
.week{background:var(--paper);border-radius:22px;padding:16px;box-shadow:var(--shadow);position:relative}
.week.now{outline:2px solid var(--green-2)}
.week-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.week-h h3{font-size:19px;font-weight:900}
.week-h span{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nowtag{background:var(--green);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-inline-start:8px;vertical-align:middle}
.blk{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;margin-top:6px}
.blk b{font-weight:700;font-size:15px}
.blk small{display:block;color:var(--ink-2);font-size:12px}
.sw{width:6px;align-self:stretch;border-radius:4px;flex:none}
.tl{overflow-x:auto;border-radius:20px;background:var(--paper);box-shadow:var(--shadow)}
.tl table{border-collapse:separate;border-spacing:0 6px;font-size:13px;min-width:100%;padding:0 6px}
.tl th,.tl td{padding:7px 8px;white-space:nowrap}
.tl thead th{font-family:var(--display);font-weight:700;color:var(--ink-2)}
.tl thead th.now{color:var(--green)}
.tl tbody th{position:sticky;right:0;background:var(--paper);text-align:right;font-weight:800;z-index:1}
.tl td.f{color:#fff;font-weight:700;text-align:center;border-radius:10px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px}
.day{border:0;background:var(--paper);border-radius:16px;padding:8px 10px;min-width:56px;text-align:center;flex:none;box-shadow:var(--shadow)}
.day b{display:block;font-family:var(--display);font-size:17px}
.day small{font-size:11px;color:var(--ink-3)}
.day[aria-selected="true"]{background:var(--green);color:#fff}
.day[aria-selected="true"] small{color:#d7e3d1}
.slots{background:var(--paper);border-radius:22px;padding:4px 16px;box-shadow:var(--shadow)}
.slot{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--stone)}
.slot:last-child{border:0}
.slot time{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--green-2)}
.slot small{display:block;color:var(--ink-2);font-size:13px}

.wk-pick{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:20px;padding:8px;box-shadow:var(--shadow);margin-bottom:12px}
.wk-arr{width:40px;height:40px;border-radius:14px;border:0;background:var(--stone);display:grid;place-items:center;flex:none}
.wk-arr:disabled{opacity:.35}
.wk-arr svg{width:15px;height:15px}
.wk-mid{flex:1;text-align:center}
.wk-mid b{display:block;font-family:var(--display);font-size:22px;font-weight:900;line-height:1.1}
.wk-mid small{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.day{position:relative}
.todaydot{position:absolute;top:5px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.day-h h3{font-size:21px;font-weight:900}
.day-h span{font-size:13px;color:var(--ink-3)}
.gcard{background:var(--paper);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.gcard.today{outline:2px solid var(--green-2)}
.gcard-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:15px}
.gcard-h span{font-weight:500;color:var(--ink-3);font-size:13px;margin-inline-start:auto}
.sw2{width:12px;height:12px;border-radius:4px;flex:none}
.gc{border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.35}
.gc small{display:block;font-weight:500;font-size:12px;opacity:.8}
.none{color:var(--ink-3)}
.rowchips{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 12px;padding:2px 18px;scrollbar-width:none}
.rc{border:2px solid var(--c);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.rc[aria-pressed="true"]{background:var(--c);color:var(--f)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px}
.gt{overflow-x:auto;background:var(--paper);border-radius:18px;box-shadow:var(--shadow)}
.gt table{border-collapse:collapse;font-size:12px;min-width:820px;width:100%}
.gt th,.gt td{border:1px solid #e3ded2;padding:4px;vertical-align:top;text-align:center}
.gt tr.hd th{background:#3f4442;color:#fff;font-family:var(--display);font-size:14px;padding:8px 4px}
.gt tr.hd th.now{background:var(--green)}
.gt tr.sub th,.gt tr.sub td{background:#eceae5;font-weight:700;color:#2b302d;font-size:12px}
.gt th.corner,.gt tr.sub th{position:sticky;right:0;z-index:1;width:86px;min-width:86px}
.gt th.rl{position:sticky;right:0;z-index:1;font-size:12px;font-weight:800;vertical-align:middle;min-width:86px}
.gt td.bar{padding:3px 4px}
.gt td .gc{font-size:12px;padding:5px 6px;margin:2px 0;border-radius:6px}
.atts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.vid{width:100%;border-radius:14px;background:#000}
.att{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:10px 12px;text-decoration:none;color:var(--ink)!important;box-shadow:var(--shadow);margin-bottom:8px}
.att-ic{width:40px;height:40px;border-radius:12px;background:var(--sage);display:grid;place-items:center;font-size:19px;flex:none}
.att-n{flex:1;min-width:0;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.att-n small{display:block;font-weight:500;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-go{color:var(--green-2);font-weight:900}
.att-x{border:0;background:var(--stone);width:32px;height:32px;border-radius:50%;flex:none}
.upl{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed #c9c3b4;border-radius:16px;padding:16px;background:var(--paper);font-weight:800;color:var(--green);cursor:pointer;text-align:center}
.upl small{font-weight:500;color:var(--ink-3);font-size:12px}
.hint{color:var(--ink-3);font-size:13px}
.thumb{border:0;padding:0;background:none;border-radius:12px;overflow:hidden}
button.att{width:100%;border:0;text-align:right;font:inherit}
.viewer{position:fixed;inset:0;z-index:80;background:#1b231d;display:none;flex-direction:column}
.viewer.on{display:flex}
.v-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#1b231d;color:#fff}
.v-title{flex:1;min-width:0}
.v-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-title small{font-size:12px;opacity:.65}
.v-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:800;flex:none}
.v-zoom{display:flex;gap:6px}
.v-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 8px calc(20px + env(safe-area-inset-bottom))}
.v-page{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);max-width:none;flex:none}
.v-img{max-width:100%;height:auto;margin:auto}
.v-pre{background:#fff;color:#111;border-radius:12px;padding:14px;white-space:pre-wrap;width:100%;max-width:800px;font-size:14px;direction:auto}
.v-msg{color:#dfe6dc;margin:auto;display:flex;align-items:center;gap:10px;text-align:center}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lockbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.lockbtn.off{background:var(--paper);color:var(--warn)}
.lock{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;justify-content:space-between;background:#122018;overflow:auto}
.lock.on{display:flex}
body.locked .wrap,body.locked .nav{visibility:hidden}
.lk-bg{position:fixed;inset:0;z-index:0}
.lk-bg .sl{position:absolute;inset:0;background-size:cover;opacity:0;transition:opacity 1.6s ease}

const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);

function mkSnapDoc(r){ return {id:r.id,exists:true,data:()=>r.data}; }
const listeners={};
function onCol(col,fn){ (listeners[col]=listeners[col]||[]).push(fn); }
let rtStarted=false;
function startRealtime(){
  if(rtStarted) return; rtStarted=true;
  SB.channel("docs-rt").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const col=(p.new&&p.new.col)||(p.old&&p.old.col); const run=c=>(listeners[c]||[]).forEach(f=>f());

  }).subscribe();
}
function docRef(col,id){
  return {
    id,
    async get(){ const {data,error}=await SB.from("docs").select("id,data").eq("col",col).eq("id",id).maybeSingle(); if(error) throw sbErr(error); return data?mkSnapDoc(data):{id,exists:false,data:()=>undefined}; },
    async set(d){ const {error}=await SB.from("docs").upsert({col,id,data:d,updated_at:new Date().toISOString()}); if(error) throw sbErr(error); },
    async delete(){ const {error}=await SB.from("docs").delete().eq("col",col).eq("id",id); if(error) throw sbErr(error); },
    onSnapshot(cb,errCb){ const load=async()=>{ try{ cb(await this.get()); }catch(e){ errCb&&errCb(e); } }; onCol(col,load); startRealtime(); load(); return ()=>{}; }
  };
}
const sbDb={
  collection(col){ return {
    doc(id){ return docRef(col,id||newId()); },

      let busy=false, again=false;
      const load=async()=>{ if(busy){ again=true; return; } busy=true;

/* import a backup file exported from the old app */
async function importBackup(file,progress){
  const pack=JSON.parse(await file.text());
  if(!pack||pack.format!=="bach-golani-export") throw new Error("זה לא קובץ גיבוי של האפליקציה");
  const ids=Object.keys(pack.files||{}); let n=0;
  for(const id of ids){ const f=pack.files[id]; n++; progress&&progress(`מעלה קבצים ${n}/${ids.length}…`);
    const bin=Uint8Array.from(atob(f.b64),c=>c.charCodeAt(0));
    const {error}=await SB.storage.from("files").upload(id,new Blob([bin],{type:f.type}),{contentType:f.type,upsert:true});
    if(error) throw sbErr(error); }
  const rows=(pack.docs||[]).map(d=>({col:d.col,id:d.id,data:d.data,updated_at:new Date().toISOString()}));
  for(let i=0;i<rows.length;i+=200){ progress&&progress(`שומר תוכן ${Math.min(i+200,rows.length)}/${rows.length}…`);
    const {error}=await SB.from("docs").upsert(rows.slice(i,i+200)); if(error) throw sbErr(error); }
  return {files:ids.length,docs:rows.length};
}

function count(k){ const n=items.filter(i=>i.section===k).length; return n?n+" פריטים":""; }
const HM={Tishri:1,Heshvan:2,Kislev:3,Tevet:4,Shevat:5,"Adar I":6,Adar:6.5,"Adar II":6.5,Nisan:7,Iyar:8,Sivan:9,Tamuz:10,Av:11,Elul:12};
const hFmt=new Intl.DateTimeFormat("en-u-ca-hebrew",{day:"numeric",month:"long",timeZone:"UTC"});
function hdate(d){ const p=hFmt.formatToParts(d); return {m:HM[p.find(x=>x.type==="month").value],d:+p.find(x=>x.type==="day").value}; }
function holidays(from,days){
  const out=[], start=Date.UTC(from.getFullYear(),from.getMonth(),from.getDate());
  const DAY=864e5, at=t=>new Date(t), dow=t=>at(t).getUTCDay();
  const add=(name,t,len,kind,note)=>out.push({name,from:t,to:t+(len-1)*DAY,len,kind,note:note||""});
  for(let t=start-10*DAY;t<start+days*DAY;t+=DAY){
    const {m,d}=hdate(at(t));
    if(m===1&&d===1) add("ראש השנה",t,2,"חג");
    if(m===1&&d===10) add("יום כיפור",t,1,"חג");
    if(m===1&&d===15) add("סוכות",t,7,"חג","חג ראשון וחול המועד");
    if(m===1&&d===22) add("שמיני עצרת ושמחת תורה",t,1,"חג");
    if(m===1&&d===24) add("יום הזיכרון לאירועי 7 באוקטובר",t,1,"זיכרון");
    if(m===3&&d===25) add("חנוכה",t,8,"מועד");
    if(m===4&&d===10) add("צום עשרה בטבת",t,1,"צום");
    if(m===5&&d===15) add("ט״ו בשבט",t,1,"מועד");
    if(m===6.5&&d===14) add("פורים",t,1,"מועד","שושן פורים (ירושלים) למחרת");
    if(m===7&&d===15) add("פסח",t,7,"חג","חג ראשון, חול המועד ושביעי של פסח");
    if(m===7&&d===27){ let x=t; if(dow(x)===5) x-=DAY; else if(dow(x)===0) x+=DAY; add("יום הזיכרון לשואה ולגבורה",x,1,"זיכרון"); }
    if(m===8&&d===4){ let z=t; const w=dow(z); if(w===4) z-=DAY; else if(w===5) z-=2*DAY; else if(w===0) z+=DAY;
      add("יום הזיכרון לחללי מערכות ישראל",z,1,"זיכרון"); add("יום העצמאות",z+DAY,1,"חג"); }
    if(m===8&&d===18) add("ל״ג בעומר",t,1,"מועד");
    if(m===8&&d===28) add("יום ירושלים",t,1,"מועד");
    if(m===9&&d===6) add("שבועות",t,1,"חג");
    if(m===10&&d===17){ let x=t; if(dow(x)===6) x+=DAY; add("צום י״ז בתמוז",x,1,"צום"); }
    if(m===11&&d===9){ let x=t; if(dow(x)===6) x+=DAY; add("תשעה באב",x,1,"צום"); }
  }
  return out.filter(h=>h.to>=start).sort((a,b)=>a.from-b.from);
}

const HOL_IC={"חג":"🕎","מועד":"🎉","צום":"🕯️","זיכרון":"🕯️"};
const dayStart=()=>{ const n=new Date(); return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); };
function holLen(n){ return n===1?"יום אחד":n===2?"יומיים":n+" ימים"; }
function holWhen(h){ const t=dayStart(), D=864e5, k=Math.round((h.from-t)/D);
  if(t>=h.from&&t<=h.to) return h.len>1?`עכשיו · יום ${Math.round((t-h.from)/D)+1} מתוך ${h.len}`:"היום";
  if(k===1) return h.kind==="חג"?"מחר (ערב חג הערב)":"מחר"; return `בעוד ${k} ימים`; }
function holDates(h){ const f=new Date(h.from), o={day:"numeric",month:"numeric",timeZone:"UTC"}, w={weekday:"short",timeZone:"UTC"};
  const a=f.toLocaleDateString("he-IL",w)+" "+f.toLocaleDateString("he-IL",o);
  if(h.len===1) return a; const e=new Date(h.to); return a+" – "+e.toLocaleDateString("he-IL",w)+" "+e.toLocaleDateString("he-IL",o); }
function holTile(){ let L=[]; try{ L=holidays(new Date(),400); }catch{ return ""; } const h=L[0]; if(!h) return "";
  return `<button class="tl2 sand full row" id="hol-tile"><div><small>החג הקרוב · ${esc(holWhen(h))}</small><h3>${esc(h.name)}</h3><small>${esc(holDates(h))} · ${holLen(h.len)}</small></div>${ARROW}</button>`; }
function openHolidays(){ const L=holidays(new Date(),370);

function renderToday(){
  const t=new Date().toISOString().slice(0,10);
  const W=sortedWeeks().find(w=>t>=w.days[0].iso&&t<=(w.days.at(-1).isoEnd||w.days.at(-1).iso));
  const chip=$("#today");
  if(!W){
    chip.textContent=new Date().toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"short"});
    $("#oper-today").textContent="";
    $("#today-in").innerHTML=`<div class="eb">היום · ${new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"})}</div><div class="ln"><b>${weeks.length?"השבוע עוד לא הועלה לגאנט":"הגאנט עוד לא הועלה"}</b>לחצו לגאנט המלא</div>`;
    return;
  }
  const di=todayIdx(W), d=W.days[di];
  chip.textContent=`${W.label} · ${d.short}`;
  const oper=W.rows.filter(r=>/אופרטיבי|כוננ/.test(r.name)).flatMap(r=>itemsFor(r,di).map(x=>x.t));
  $("#oper-today").textContent=oper.join(" · ");
  const lines=W.rows.filter(r=>/מחזור/.test(r.name)).map(r=>({r,list:(r.cells?.[di]||[])})).filter(x=>x.list.length);
  $("#today-in").innerHTML=`<div class="eb">היום · ${esc(d.name)} ${esc(d.date)}</div>`+
    (lines.length?lines.map(({r,list})=>`<div class="ln"><b>${esc(r.name)}</b>${esc(list.join(", "))}</div>`).join(""):`<div class="ln"><b>אין פעילות מחזורים היום</b>לחצו לגאנט המלא</div>`);
}

/* routing */
function show(view){
  current=view||"home";
  if(current!=="home"&&current!=="gantt"&&current!=="cmd"&&!SECTIONS[current]) current="home";
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  if(current==="home"){ $("#s-home").classList.add("on"); renderGrid(); }
  else if(current==="gantt"){ $("#s-gantt").classList.add("on"); renderGantt(); }
  else if(current==="cmd"){ $("#s-cmd").classList.add("on"); renderCmd(); }
  else { $("#s-list").classList.add("on"); listSub=SECTIONS[current].subs?.[0][0]||null; renderList(); }
  document.querySelectorAll(".nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.go===current));
  document.querySelectorAll(".nav button[aria-current]").forEach(b=>b.setAttribute("aria-current","page"));
  window.scrollTo(0,0);
}
function go(v){ if(location.hash.slice(1)===v||(v==="home"&&!location.hash)) show(v); else location.hash=v==="home"?"":v; }
addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  if(e.target.closest("[data-back]")) go("home");
  const o=e.target.closest("[data-open]"); if(o) openItem(o.dataset.open);
});

const nrm=t=>String(t||"").replace(/[״"׳'\s]/g,"");
function phoneDepts(all){
  const used=new Set();
  const html=DEPTS.map(([d,roles])=>{
    const rows=roles.map(r=>{ const hit=all.filter(i=>nrm(i.role)===nrm(r)&&(!i.unit||nrm(i.unit)===nrm(d)||!DEPTS.some(x=>nrm(x[0])===nrm(i.unit))));
      hit.forEach(i=>used.add(i.id));
      return hit.length?hit.map(i=>phoneRow(i,d)).join(""):`<div class="ph-row ph-empty"><span class="ph-av">·</span><span class="ph-t"><b>${esc(r)}</b><small>טרם הוזן</small></span>${canWrite?`<button class="ph-btn" data-newph="${esc(d)}|${esc(r)}" aria-label="הוספת ${esc(r)}">+</button>`:""}</div>`; }).join("");
    return `<div class="mon-h"><b>${esc(d)}</b><span>${roles.length} תפקידים</span></div><div class="ph-list">${rows}</div>`; }).join("");
  const rest=all.filter(i=>!used.has(i.id)).sort((a,b)=>(a.unit||"").localeCompare(b.unit||"","he")||a.title.localeCompare(b.title,"he"));
  return html+(rest.length?`<div class="mon-h"><b>נוספים</b><span>${rest.length}</span></div><div class="ph-list">${rest.map(i=>phoneRow(i)).join("")}</div>`:"");
}

  return `<button class="row-item" data-open="${esc(i.id)}"><span class="ic" style="background:${s.bg}">${esc(s.ic||"")}</span>

const PH_ORDER=["מפקדה","ממ״חים","אג״ם והדרכה","רפואה","ת״ש וחינוך","לוגיסטיקה"];

  return `<li><div class="tn"><button class="tn-m" data-open="${esc(i.id)}"><b>${esc(i.role||"—")}</b><span>${esc(i.title)}</span></button>${i.phone?`<a class="ph-btn" href="${telHref(i.phone)}" aria-label="התקשרות ל${esc(i.title)}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>`:""}</div>${kids}</li>`;
}
function phoneTree(all){
  if(!all.length) return `<div class="empty"><b>האלפון ריק</b>הוסיפו אנשי קשר כדי לבנות את העץ</div>`;
  const byName=new Map(all.map(i=>[i.title,i]));
  const kidsOf=p=>all.filter(i=>i.boss===p.title);
  const sub=(p,seen=new Set())=>{ if(seen.has(p.id)) return ""; seen.add(p.id); const k=kidsOf(p); return k.length?`<ul>${k.map(c=>phNode(c,sub(c,seen))).join("")}</ul>`:""; };
  const roots=all.filter(i=>i.head==="root");
  const units=[...new Set(all.filter(i=>i.head!=="root").map(i=>i.unit||"אחר"))].sort((a,b)=>{ const x=PH_ORDER.indexOf(a),y=PH_ORDER.indexOf(b); return (x<0?99:x)-(y<0?99:y)||a.localeCompare(b,"he"); });
  const branch=u=>{ const top=all.filter(i=>i.head!=="root"&&(i.unit||"אחר")===u&&(!i.boss||!byName.has(i.boss)||roots.some(r=>r.title===i.boss)));
    top.sort((a,b)=>(b.head==="1")-(a.head==="1")||(a.role||"").localeCompare(b.role||"","he"));
    return `<li><div class="tn br"><b>${esc(u)}</b><small>${all.filter(i=>(i.unit||"אחר")===u).length}</small></div><ul>${top.map(i=>phNode(i,sub(i))).join("")}</ul></li>`; };
  const body=units.map(branch).join("");
  return `<div class="tree">${roots.length?`<ul class="t0">${roots.map(r=>`<li><div class="tn root"><button class="tn-m" data-open="${esc(r.id)}"><b>${esc(r.role||"")}</b><span>${esc(r.title)}</span></button>${r.phone?`<a class="ph-btn" href="${telHref(r.phone)}" aria-label="התקשרות"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>`:""}</div><ul>${body}</ul></li>`).join("")}</ul>`:`<ul class="t0">${body}</ul>`}</div>`;
}

    <div class="field"><label for="p-role">תפקיד</label><input id="p-role" list="p-roles" placeholder="בחרו תפקיד מהרשימה" value="${esc(i?.role??pre?.role)}"><datalist id="p-roles">${DEPTS.flatMap(d=>d[1]).map(r=>`<option value="${esc(r)}">`).join("")}</datalist></div>

function writeErr(err){
  if(err?.code==="invalid_argument"){ canWrite=false; if(SECTIONS[current]) renderList(); return "אין הרשאת עריכה. היכנסו כמנהל דרך כפתור המנעול למעלה."; }

  return "השמירה נכשלה. בדקו חיבור ונסו שוב.";
}

/* gantt */
const LEGEND_FG = c => { const h=c.replace("#",""); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return (r*299+g*587+b*114)/1000>150?"#1d2a20":"#fff"; };
document.querySelectorAll("[data-gtab]").forEach(t=>t.onclick=()=>{
  gtab=t.dataset.gtab;
  document.querySelectorAll("[data-gtab]").forEach(x=>x.setAttribute("aria-selected",x===t));
  renderGantt();
});
function sortedWeeks(){ return [...weeks].sort((a,b)=>(a.days?.[0]?.iso||"").localeCompare(b.days?.[0]?.iso||"")); }
function todayIdx(W){ const t=new Date().toISOString().slice(0,10); return W.days.findIndex(d=>d.iso&&(d.iso===t||(d.isoEnd&&t>=d.iso&&t<=d.isoEnd))); }
function pickWeek(){
  const ws=sortedWeeks(); if(!ws.length) return null;
  if(gweek&&ws.find(w=>w.id===gweek)) return ws.find(w=>w.id===gweek);
  const t=new Date().toISOString().slice(0,10);
  let w=ws.find(w=>t>=w.days[0].iso&&t<=(w.days.at(-1).isoEnd||w.days.at(-1).iso));
  if(!w) w=ws.find(w=>w.days[0].iso>t)||ws.at(-1);
  gweek=w.id; return w;
}
$("#wk-prev").onclick=()=>stepWeek(-1); $("#wk-next").onclick=()=>stepWeek(1);
function stepWeek(d){ const ws=sortedWeeks(), i=ws.findIndex(w=>w.id===gweek); const n=ws[i+d]; if(n){ gweek=n.id; gday=null; renderGantt(); } }
function chip(text,row,extra=""){ return `<div class="gc" style="background:${esc(row.color)};color:${LEGEND_FG(row.color)}">${esc(text)}${extra}</div>`; }
function itemsFor(row,di){
  const out=[];
  (row.bars||[]).forEach(b=>{ if(di>=b.from&&di<=b.to) out.push({t:b.text,span:b.to>b.from}); });
  (row.cells?.[di]||[]).forEach(t=>out.push({t}));
  return out;
}
function renderGantt(){
  $("#wk-pick").hidden=gtab==="graph";
  if(gtab==="graph"){ renderGraph(); return; }
  const W=pickWeek(), ws=sortedWeeks(), i=W?ws.findIndex(w=>w.id===W.id):-1;
  $("#wk-prev").disabled=i<=0; $("#wk-next").disabled=i<0||i>=ws.length-1;
  if(!W){ $("#wk-title").textContent="אין עדיין שבועות"; $("#wk-range").textContent=""; $("#g-body").innerHTML='<div class="empty"><b>הגאנט עוד לא הועלה</b>שלחו צילום של השבוע ל-Claude והוא יבנה אותו כאן</div>'; return; }
  $("#wk-title").textContent=W.label;
  $("#wk-range").textContent=`${W.days[0].date} – ${W.days.at(-1).date}`+(W.version?` · ${W.version}`:"");
  const ti=todayIdx(W);
  if(gtab==="day"){
    if(gday===null||gday>=W.days.length) gday=ti>=0?ti:0;
    const d=W.days[gday];
    const blocks=W.rows.map(r=>({r,list:itemsFor(r,gday)})).filter(x=>x.list.length);
    $("#g-body").innerHTML=`<div class="days" role="tablist">${W.days.map((x,k)=>`<button class="day" role="tab" data-day="${k}" aria-selected="${k===gday}"><b>${esc(x.short)}</b><small>${esc(x.date)}</small>${k===ti?'<i class="todaydot"></i>':""}</button>`).join("")}</div>
      <div class="day-h"><h3>${esc(d.name)}</h3><span>${esc(d.date)} · ${esc(d.heb)}</span></div>
      ${blocks.length?`<div class="list">${blocks.map(({r,list})=>`<div class="gcard"><div class="gcard-h"><span class="sw2" style="background:${esc(r.color)}"></span>${esc(r.name)}</div>${list.map(x=>chip(x.t,r,x.span?'<small>לאורך כמה ימים</small>':"")).join("")}</div>`).join("")}</div>`:'<div class="empty"><b>אין פעילות ביום הזה</b></div>'}`;
    document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ gday=+b.dataset.day; renderGantt(); });
  } else if(gtab==="row"){
    if(!grow||!W.rows.find(r=>r.key===grow)) grow=(W.rows.find(r=>/מחזור/.test(r.name))||W.rows[0]).key;
    const r=W.rows.find(x=>x.key===grow);
    $("#g-body").innerHTML=`<div class="rowchips">${W.rows.map(x=>`<button class="rc" data-row="${esc(x.key)}" aria-pressed="${x.key===grow}" style="--c:${esc(x.color)};--f:${LEGEND_FG(x.color)}">${esc(x.name)}</button>`).join("")}</div>
      ${(r.bars||[]).length?`<div class="gcard"><div class="gcard-h">לאורך השבוע</div>${r.bars.map(b=>chip(b.text,r,`<small>${esc(W.days[b.from].short)}${b.to>b.from?" – "+esc(W.days[b.to].short):""}</small>`)).join("")}</div>`:""}
      <div class="list" style="margin-top:10px">${W.days.map((d,k)=>{ const c=r.cells?.[k]||[]; return `<div class="gcard ${k===ti?"today":""}"><div class="gcard-h">${esc(d.name)} <span>${esc(d.date)}</span></div>${c.length?c.map(t=>chip(t,r)).join(""):'<small class="none">—</small>'}</div>`; }).join("")}</div>`;
    document.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{ grow=b.dataset.row; renderGantt(); });
  } else {
    const n=W.days.length;
    const G=(t,r)=>`<div class="gc" style="background:${esc(r.color)};color:${LEGEND_FG(r.color)}">${esc(t)}</div>`;
    const rowsHtml=W.rows.map(r=>{
      const lines={}; (r.bars||[]).forEach(b=>{ (lines[b.line||0] ||= []).push(b); });
      const trs=Object.keys(lines).sort().map(l=>{ let h="",k=0; const bs=lines[l];
        while(k<n){ const b=bs.find(b=>b.from===k); if(b){ h+=`<td colspan="${b.to-b.from+1}" class="bar">${G(b.text,r)}</td>`; k=b.to+1; } else { h+="<td></td>"; k++; } }
        return h; });
      const has=Object.values(r.cells||{}).some(c=>c.length);
      if(has||!trs.length) trs.push(W.days.map((_,k)=>`<td>${(r.cells?.[k]||[]).map(t=>G(t,r)).join("")}</td>`).join(""));
      return trs.map((h,j)=>`<tr>${j===0?`<th class="rl" rowspan="${trs.length}" style="background:${esc(r.color)};color:${LEGEND_FG(r.color)}">${esc(r.name)}</th>`:""}${h}</tr>`).join("");
    }).join("");
    $("#g-body").innerHTML=`<div class="legend">${W.rows.map(r=>`<span><i style="background:${esc(r.color)}"></i>${esc(r.name)}</span>`).join("")}</div>
      <div class="gt"><table><tbody><tr class="hd"><th class="corner">יום</th>${W.days.map((d,k)=>`<th class="${k===ti?"now":""}">${esc(d.name)}</th>`).join("")}</tr>
      <tr class="sub"><th>תאריך לועזי</th>${W.days.map(d=>`<td>${esc(d.date)}</td>`).join("")}</tr>
      <tr class="sub"><th>תאריך עברי</th>${W.days.map(d=>`<td>${esc(d.heb)}</td>`).join("")}</tr>${rowsHtml}</tbody></table></div>
      <p class="status">גוללים הצידה כדי לראות את כל הימים</p>`;
  }
}

/* graph (multi-week) */
const DAYN=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const isoD=s=>new Date(s+"T12:00:00");
const ddmm=s=>{ const d=isoD(s); return d.getDate()+"."+(d.getMonth()+1); };
function graphDays(G){ const out=[]; for(let d=isoD(G.from); d<=isoD(G.to); d.setDate(d.getDate()+1)) out.push(d.toISOString().slice(0,10)); return out; }
const bFg=c=>LEGEND_FG(c||"#dddddd");
function renderGraph(){
  const G=graphDoc, body=$("#g-body");
  if(!G){ body.innerHTML='<div class="empty"><b>הגרף עוד לא הועלה</b>מנהל יכול להעלות אותו דרך ייבוא</div>'; return; }
  const today=new Date().toISOString().slice(0,10);
  const allRows=G.groups.flatMap(g=>g.rows);
  if(!grRow||!allRows.find(r=>r.key===grRow)) grRow=(today>="2026-11-08"?allRows.find(r=>r.key==="a51"):null)?.key||allRows.find(r=>/^u/.test(r.key))?.key||allRows[0].key;
  const head=`<div class="gr-head"><div><b>${esc(G.label)}</b><small>${ddmm(G.from)} – ${ddmm(G.to)} · שבועות ${G.weeks[0].n}–${G.weeks.at(-1).n}</small></div>
    <div class="mini-seg"><button data-grv="rows" aria-pressed="${grView==="rows"}">לפי שורה</button><button data-grv="table" aria-pressed="${grView==="table"}">טבלה</button></div></div>`;
  if(grView==="rows"){
    const r=allRows.find(x=>x.key===grRow);
    const chips=G.groups.map(g=>`<div class="gr-gl">${esc(g.name)}</div><div class="rowchips">${g.rows.map(x=>`<button class="rc" data-grow="${esc(x.key)}" aria-pressed="${x.key===grRow}" style="--c:${esc(x.color)};--f:${bFg(x.color)}">${esc(x.name)}</button>`).join("")}</div>`).join("");
    const byWeek=G.weeks.map(w=>({w,bl:r.blocks.filter(b=>b.to>=w.from&&b.from<=w.to)})).filter(x=>x.bl.length);
    const span=b=>{ const a=isoD(b.from), z=isoD(b.to); return b.from===b.to?`${DAYN[a.getDay()]} ${ddmm(b.from)}`:`${DAYN[a.getDay()]} ${ddmm(b.from)} – ${DAYN[z.getDay()]} ${ddmm(b.to)}`; };
    body.innerHTML=head+chips+`<div class="list" style="margin-top:6px">${byWeek.map(({w,bl})=>{ const now=today>=w.from&&today<=w.to;
      return `<div class="gcard ${now?"today":""}"><div class="gcard-h">שבוע ${w.n}${w.train?` · שבוע ${w.train} בהכשרה`:""}${w.note?` · ${esc(w.note)}`:""}<span>${ddmm(w.from)} – ${ddmm(w.to)}</span></div>
      ${bl.map(b=>{ const c=b.color||r.color, past=b.to<today; return `<div class="gc ${past?"past":""}" style="background:${esc(c)};color:${bFg(c)}">${esc(b.text)}${(G.uncertain||[]).includes(b.text)?" (?)":""}<small>${span(b)}</small></div>`; }).join("")}</div>`; }).join("")||'<div class="empty"><b>אין פעילות בשורה הזאת</b></div>'}</div>`;
  } else {
    const days=graphDays(G);
    const cells=r=>{ let h="",k=0; const bl=[...r.blocks].sort((a,b)=>a.from.localeCompare(b.from));
      const lines=[]; bl.forEach(b=>{ let L=lines.find(l=>l.at(-1).to<b.from); if(!L){ L=[]; lines.push(L); } L.push(b); });
      return lines.map(L=>{ let h="",k=0; while(k<days.length){ const b=L.find(b=>b.from===days[k]); if(b){ const n=days.indexOf(b.to)-k+1; const c=b.color||r.color; h+=`<td colspan="${n}" class="bar"><div class="gc" style="background:${esc(c)};color:${bFg(c)}">${esc(b.text)}</div></td>`; k+=n; } else { const sat=isoD(days[k]).getDay()===6; h+=`<td class="${sat?"sat":""}"></td>`; k++; } } return h; });
    };
    const rowsHtml=G.groups.map(g=>`<tr class="grp"><th class="rl" style="background:var(--ink);color:var(--sand)">${esc(g.name)}</th><td colspan="${days.length}" style="background:var(--stone)"></td></tr>`+
      g.rows.map(r=>{ const L=cells(r); if(!L.length) L.push(days.map(()=>"<td></td>").join(""));
        return L.map((h,j)=>`<tr>${j===0?`<th class="rl" rowspan="${L.length}" style="background:${esc(r.color)};color:${bFg(r.color)}">${esc(r.name)}</th>`:""}${h}</tr>`).join(""); }).join("")).join("");
    const wk=G.weeks.map(w=>{ const n=days.filter(d=>d>=w.from&&d<=w.to).length; return n?`<th colspan="${n}">שבוע ${w.n}${w.train?` · ${w.train} בהכשרה`:""}${w.note?` · ${esc(w.note)}`:""}</th>`:""; }).join("");
    body.innerHTML=head+`<div class="gt gr"><table><tbody><tr class="hd"><th class="corner">שבוע</th>${wk}</tr>
      <tr class="sub"><th>תאריך</th>${days.map(d=>{ const x=isoD(d); return `<td class="${x.getDay()===6?"sat":""} ${d===today?"now":""}">${DAYN[x.getDay()]}<br>${ddmm(d)}</td>`; }).join("")}</tr>${rowsHtml}</tbody></table></div>
      <p class="status">גוללים הצידה כדי לראות את כל הימים</p>`;
  }
  body.querySelectorAll("[data-grow]").forEach(b=>b.onclick=()=>{ grRow=b.dataset.grow; renderGraph(); });
  body.querySelectorAll("[data-grv]").forEach(b=>b.onclick=()=>{ grView=b.dataset.grv; renderGraph(); });
}

  </div>`;
  // today + tomorrow (gantt)
  if(W){

    const dayBlock=(i,title)=>{ const d=W.days[i]; if(!d) return "";

/* countdown */
function parts(){
  if(!settings.draftDate) return null;
  const ms=new Date(settings.draftDate).getTime()-Date.now(); if(isNaN(ms)) return null;
  const t=Math.max(0,ms);
  return {past:ms<=0,d:Math.floor(t/864e5),h:Math.floor(t/36e5)%24,m:Math.floor(t/6e4)%60,s:Math.floor(t/1e3)%60};
}

/* ---------- encryption ---------- */
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=buf=>{ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const unb64=str=>{ const s=atob(str), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
let KEY=null, vault=null, canEdit=false;
const ITER=600000;
async function kek(pass,salt){
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:vault?.iter||ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function aesEnc(key,bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes); return {iv:b64(iv),ct:b64(ct)}; }
async function aesDec(key,o){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct))); }
const importDek=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},true,["encrypt","decrypt"]);
async function sealObj(obj){ return {enc:1,...await aesEnc(KEY,enc.encode(JSON.stringify(obj))),updatedAt:Date.now()}; }
async function openObj(d){ return JSON.parse(dec.decode(await aesDec(KEY,d))); }
async function sealFile(file){
  const raw=await aesEnc(KEY,new Uint8Array(await file.arrayBuffer()));
  return new Blob([raw.iv+"."+raw.ct],{type:"text/plain"});
}
async function openFileBytes(f){
  const r=await fetch(BLOB+f.id); if(!r.ok) throw new Error("fetch");
  if(!f.enc) return new Uint8Array(await r.arrayBuffer());
  const [iv,ct]=(await r.text()).split(".");
  return aesDec(KEY,{iv,ct});
}
async function createVault(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), raw=crypto.getRandomValues(new Uint8Array(32));
  vault={salt:b64(salt),iter:ITER};
  const k=await kek(pass,salt);
  vault.wrapped=await aesEnc(k,raw);
  vault.createdAt=Date.now();
  const cur=await db.doc("vault/meta").get();
  if(cur.exists) throw {code:"exists"};
  await db.doc("vault/meta").set(vault);
  KEY=await importDek(raw);
  return raw;
}
async function unlockVault(pass){
  const k=await kek(pass,unb64(vault.salt));
  const raw=await aesDec(k,vault.wrapped); // throws on wrong password
  KEY=await importDek(raw);
  return raw;
}
async function changePass(oldp,newp){
  const raw=await aesDec(await kek(oldp,unb64(vault.salt)),vault.wrapped);
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const nv={...vault,salt:b64(salt),iter:ITER}; vault=nv;
  nv.wrapped=await aesEnc(await kek(newp,salt),raw);
  await db.doc("vault/meta").set(nv);
}
const REM="bach-key-v1";
function remember(raw){ try{ sessionStorage.setItem(REM,b64(raw)); }catch{} }
function forget(){ try{ localStorage.removeItem(REM); }catch{} try{ sessionStorage.removeItem(REM); }catch{} }
async function tryRemembered(){ try{ localStorage.removeItem(REM); }catch{} try{ const r=sessionStorage.getItem(REM); if(!r) return false; const raw=unb64(r); KEY=await importDek(raw);
  // verify against any encrypted doc later; if wrong, decrypt fails and we re-lock
  return true; }catch{ return false; } }

  if(!vault){ openSheet(`<h2>ניהול</h2><p style="color:var(--ink-2);margin:0 0 6px">${SESSION?"אין עדיין תוכן מוצפן. ייבאו את קובץ הגיבוי מהאפליקציה הקודמת, או הפעילו הצפנה.":"כניסה למנהלים בלבד."}</p>
      ${SESSION?'<div class="btns" style="flex-direction:column"><button class="ghost" id="sec-setup">הפעלת הצפנה חדשה</button></div>':""}${adminBlock()}
      <div class="btns"><button class="ghost" id="sec-close">סגירה</button></div><div class="err" id="sec-e"></div>`);
    $("#sec-close").onclick=closeSheet; if($("#sec-setup")) $("#sec-setup").onclick=()=>{ closeSheet(); lockScreen("setup"); }; adminWire(); return; }
  openSheet(`<h2>אבטחה</h2><p style="color:var(--ink-2);margin:0 0 14px">התוכן באפליקציה שמור מוצפן.</p>
    <div class="btns" style="flex-direction:column"><button class="add" id="sec-lock">נעילה עכשיו</button>
    ${canEdit?'<button class="ghost" id="sec-chg">החלפת סיסמה</button>':""}<button class="ghost" id="sec-close">סגירה</button></div>${adminBlock()}<div class="err" id="sec-e"></div>`);
  $("#sec-close").onclick=closeSheet; adminWire();
  $("#sec-lock").onclick=()=>{ forget(); location.reload(); };
  if(canEdit) $("#sec-chg").onclick=()=>{
    openSheet(`<h2>החלפת סיסמה</h2><form id="cp"><div class="field"><label for="cp-o">סיסמה נוכחית</label><input id="cp-o" type="password" required></div>
      <div class="field"><label for="cp-n">סיסמה חדשה</label><input id="cp-n" type="password" minlength="10" required></div>
      <div class="field"><label for="cp-n2">הקלדה חוזרת</label><input id="cp-n2" type="password" required></div>
      <div class="btns"><button class="add" type="submit" id="cp-b">החלפה</button><button class="ghost" type="button" id="cp-c">ביטול</button></div><div class="err" id="cp-e"></div></form>`);
    $("#cp-c").onclick=closeSheet;
    $("#cp").onsubmit=async e=>{ e.preventDefault();
      if($("#cp-n").value.length<10){ $("#cp-e").textContent="לפחות 10 תווים"; return; }
      if($("#cp-n").value!==$("#cp-n2").value){ $("#cp-e").textContent="הסיסמאות לא זהות"; return; }
      $("#cp-b").disabled=true;
      try{ await changePass($("#cp-o").value,$("#cp-n").value); forget(); closeSheet(); setStatus("הסיסמה הוחלפה. מעבירים למ״פים את החדשה."); }
      catch(err){ $("#cp-e").textContent=err?.code?writeErr(err):"הסיסמה הנוכחית לא נכונה"; $("#cp-b").disabled=false; } };
  };
};

/* ---------- data ---------- */
const setStatus=t=>$("#status").textContent=t;
function refresh(){ if(current==="home") renderGrid(); else if(current==="gantt") renderGantt(); else if(current==="cmd") renderCmd(); else renderList(); tick(); }
const decCache=new Map();
async function decodeDocs(docs){
  return (await Promise.all(docs.map(async d=>{
    const raw=d.data(); if(!raw) return null;
    if(!raw.enc) return {id:d.id,...raw,_plain:true};
    const ck=d.id+"|"+raw.iv; if(decCache.has(ck)) return decCache.get(ck);
    try{ const o={id:d.id,...await openObj(raw)}; decCache.set(ck,o); return o; }catch{ return {id:d.id,_bad:true}; }
  }))).filter(Boolean);
}
let started=false, migrating=false;
function startData(){
  if(started) return; started=true;
  let loaded=false;
  const timer=setTimeout(()=>{ if(!loaded) setStatus("לא מצליחים לטעון את התוכן כרגע. בדקו את החיבור."); },10000);
  db.collection("items").onSnapshot(async snap=>{
    const list=await decodeDocs(snap.docs);
    if(vault&&list.some(x=>x._bad)&&!list.some(x=>!x._bad&&!x._plain)){ forget(); location.reload(); return; }
    items=list.filter(i=>!i._bad&&i.title);
    if(!snap.metadata.fromCache){ loaded=true; clearTimeout(timer); setStatus(""); migrate(); }
    refresh(); if($("#q").value.trim()) $("#q").dispatchEvent(new Event("input"));
  },()=>{ clearTimeout(timer); setStatus("טעינת התוכן נכשלה. רעננו את הדף."); });
  db.collection("gantt").onSnapshot(async s=>{
    const list=await decodeDocs(s.docs);
    const NO_OPER=r=>!/כוננ|אופרטיבי/.test(r.name||"");
    if(!window._repoGantt) window._repoGantt=fetch("data/gantt.json",{cache:"no-store"}).then(r=>r.ok?r.json():{}).catch(()=>({}));
    const repo=await window._repoGantt;
    for(const [id,w] of Object.entries(repo||{})){ const i=list.findIndex(x=>x&&x.id===id); const doc={id,...w}; if(i>=0) list[i]=doc; else list.push(doc); }
    let g0=list.find(w=>w&&!w._bad&&w.kind==="graph")||{kind:"graph",src:"data/graph.json",v:Date.now()};
    if(g0&&g0.src){ try{ const r=await fetch(g0.src+"?v="+(g0.v||1)); if(r.ok) g0=await r.json(); else g0=null; }catch{ g0=null; } }
    graphDoc=g0?{...g0,groups:(g0.groups||[]).map(g=>({...g,rows:(g.rows||[]).filter(NO_OPER)})).filter(g=>g.rows.length)}:null;
    weeks=list.filter(w=>w&&!w._bad&&w.days&&w.rows).map(w=>({...w,rows:w.rows.filter(NO_OPER)})); if(current==="home") renderToday();
    if(!s.metadata.fromCache) migrate();
    if(current==="gantt") renderGantt(); if(current==="cmd") renderCmd();
  },()=>{});
  db.doc("settings/main").onSnapshot(s=>{ settings=s.exists?s.data():{}; tick(); if(current==="cmd") renderCmd(); },()=>{});
}
/* encrypt anything still stored in the clear (old items, new gantt weeks, old files) */
async function fbSend(rec){ const {error}=await SB.from("feedback").insert({kind:rec.kind,name:rec.name,body:rec.text}); if(error) throw sbErr(error); }
async function fbList(){ const {data,error}=await SB.from("feedback").select("*").order("created_at",{ascending:false}).limit(500); if(error) throw sbErr(error); return (data||[]).map(r=>({kind:r.kind,name:r.name,text:r.body,at:Date.parse(r.created_at),_id:r.id})); }
async function fbDel(m){ const {error}=await SB.from("feedback").delete().eq("id",m._id); if(error) throw sbErr(error); }
function fbInit(){
  const f=$("#fb-f"); if(!f) return;
  $("#fb-adm").hidden=!canEdit;
  f.onsubmit=async e=>{ e.preventDefault(); const text=$("#fb-t").value.trim(); if(!text) return;
    const rec={kind:(f.querySelector('input[name=fbk]:checked')||{}).value||"",name:$("#fb-n").value.trim(),text,at:Date.now()};
    $("#fb-b").disabled=true; $("#fb-e").textContent="שולח…";
    try{ await fbSend(rec); $("#fb-t").value=""; $("#fb-e").textContent="תודה! הפנייה נשלחה למנהל."; }
    catch(err){ console.error(err); $("#fb-e").textContent="השליחה נכשלה. נסו שוב בעוד רגע."; }
    $("#fb-b").disabled=false; };
  $("#fb-adm").onclick=async()=>{
    openSheet('<h2>פניות שהתקבלו</h2><div id="fb-l"><span class="spin"></span> טוען…</div><div class="btns"><button class="ghost" id="fb-c">סגירה</button></div><div class="err" id="fb-le"></div>');
    $("#fb-c").onclick=closeSheet;
    const draw=async()=>{ try{ const L=(await fbList()).sort((a,b)=>(b.at||0)-(a.at||0));
        $("#fb-l").innerHTML=L.length?L.map((m,k)=>`<div class="fb-it"><div class="h"><b>${esc(m.kind||"פנייה")}${m.name?" · "+esc(m.name):""}</b><span>${m.at?new Date(m.at).toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):""}</span></div><p>${esc(m.text)}</p><button class="ghost" data-fbdel="${k}" style="padding:4px 10px;font-size:13px">מחיקה</button></div>`).join(""):'<p style="color:var(--ink-2)">אין פניות עדיין.</p>';
        $("#fb-l").onclick=async e=>{ const b=e.target.closest("[data-fbdel]"); if(!b) return; if(!confirm("למחוק את הפנייה?")) return; try{ await fbDel(L[+b.dataset.fbdel]); draw(); }catch(err){ $("#fb-le").textContent=writeErr(err); } };
      }catch(err){ $("#fb-l").textContent="לא הצלחנו לטעון את הפניות."; } };
    draw(); };
}
async function migrate(){
  if(!KEY||!canWrite||migrating) return; migrating=true;
  try{
    const todo=[...items.filter(i=>i._plain).map(i=>["items",i]),...weeks.filter(w=>w._plain).map(w=>["gantt",w])];
    for(const [col,o] of todo){
      const {id,_plain,...data}=o;
      if(col==="items"&&data.files?.length&&assets){
        const out=[];
        for(const f of data.files){
          if(f.enc){ out.push(f); continue; }
          setStatus(`מצפין את "${f.name}"…`);
          const r=await fetch(BLOB+f.id); const blob=await r.blob();
          if(blob.size>14.5*1024*1024){ out.push(f); continue; }
          const up=await assets.upload(await sealFile(blob),{type:"text/plain"});
          out.push({id:up.id,name:f.name,type:f.type,size:f.size,enc:true});
          assets.delete(f.id).catch(()=>{});
        }
        data.files=out;
      }
      await db.collection(col).doc(id).set(await sealObj(data));
    }
    if(todo.length) setStatus("");
  }catch(err){ console.error(err); setStatus("חלק מהתוכן עוד לא הוצפן. נסו לרענן."); }
  migrating=false;
}
(async()=>{
  try{ sbInit(); db=sbDb; assets=sbAssets; }catch{ db=null; }
  if(!db){ setStatus("אין חיבור לשרת. בדקו את החיבור ורעננו."); canWrite=false; refresh(); return; }
  try{ const {data}=await SB.auth.getSession(); SESSION=data.session; }catch{}
  canWrite=!!SESSION; canEdit=canWrite;
  fbInit();
  let v=null; try{ v=await db.doc("vault/meta").get(); }catch{}
  vault=v&&v.exists?v.data():null;
  updateLockBtn();
  if(vault){ if(await tryRemembered()) unlocked(); else lockScreen("unlock"); }
  else startData();
})();
show(location.hash.slice(1));
</script>
