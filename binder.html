<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>אוגדן לקחים · בא״ח גולני</title>
<style>
  :root{--ink:#23301f;--leaf:#3f5a2e;--sand:#f3efe4;--line:#d9d2bf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--ink);color:#fff}
  header h1{font-size:16px;margin:0;flex:1;line-height:1.3}
  header a{color:#fff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .lock{max-width:380px;margin:12vh auto 0;padding:28px 22px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center}
  .lock h2{margin:0 0 6px;font-size:22px}
  .lock p{margin:0 0 18px;color:#5b6650;font-size:15px}
  .lock input{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-align:center}
  .lock button{margin-top:12px;width:100%;font-size:17px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--leaf);color:#fff}
  .err{color:#a33;min-height:22px;margin-top:10px;font-size:14px}
  .tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-bottom:14px;color:#5b6650}
  .pages{max-width:900px;margin:0 auto;padding:12px}
  .pages img{display:block;width:100%;height:auto;margin:0 0 12px;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .msg{text-align:center;padding:40px 16px;color:#5b6650}
</style>
</head>
<body>
<header><h1 id="t">אוגדן לקחים</h1><a href="./#learning/binders">לאפליקציה</a></header>
<main id="main"><div class="msg">טוען…</div></main>
<script>
const $=s=>document.querySelector(s), enc=new TextEncoder();
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const id=(location.hash.slice(1)||"sikumim").replace(/[^a-z0-9_-]/gi,"");
let data=null;
addEventListener("hashchange",()=>location.reload());
async function keyFor(pass){
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(data.salt),iterations:data.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const dec=(k,p)=>crypto.subtle.decrypt({name:"AES-GCM",iv:ub(p.iv)},k,ub(p.ct));
function lockScreen(err){
  $("#main").innerHTML=`<form class="lock" id="f"><span class="tag">שמור</span><h2>${data.title.split("–")[0].trim()}</h2><p>הקלידו את סיסמת האפליקציה</p>
    <input id="pw" type="password" autocomplete="current-password" required autofocus><button>פתיחה</button><div class="err" id="e">${err||""}</div></form>`;
  $("#f").onsubmit=async e=>{ e.preventDefault(); $("#e").textContent="בודק…"; await tryOpen($("#pw").value,true); };
}
async function tryOpen(pass,typed){
  let k; try{ k=await keyFor(pass); await dec(k,data.chk); }catch{ try{sessionStorage.removeItem("bpw");}catch{} if(typed) lockScreen("סיסמה שגויה"); else lockScreen(); return; }
  try{ sessionStorage.setItem("bpw",pass); }catch{}
  const main=$("#main"); main.innerHTML='<div class="pages" id="pg"></div>';
  for(let i=0;i<data.pages.length;i++){
    const img=new Image(); img.alt="עמוד "+(i+1); $("#pg").appendChild(img);
    dec(k,data.pages[i]).then(b=>img.src=URL.createObjectURL(new Blob([b],{type:"image/jpeg"}))).catch(()=>img.alt="לא הצלחנו לפתוח את העמוד");
  }
}
(async()=>{
  try{ const r=await fetch("data/binders/"+id+".json",{cache:"no-store"}); if(!r.ok) throw 0; data=await r.json(); }
  catch{ $("#main").innerHTML='<div class="msg">האוגדן לא נמצא</div>'; return; }
  $("#t").textContent=data.title; document.title=data.title.split("–")[0].trim()+" · בא״ח גולני";
  let saved=null; try{ saved=sessionStorage.getItem("bpw"); }catch{}
  if(saved) tryOpen(saved,false); else lockScreen();
})();
</script>
</body>
</html>
